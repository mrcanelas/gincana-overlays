<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Overlay Principal — XXII Gincana</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
  </style>
</head>
<body>
  <!-- Fonte composta: use URLs dedicadas no OBS para melhor controle.
       Esta página agrega cronômetro + resultados + apuração sobrepostos. -->
  <iframe src="/cronometro" title="Cronômetro"></iframe>
  <iframe src="/resultados" title="Resultados"></iframe>
  <iframe src="/apuracao" title="Apuração"></iframe>
</body>
</html>
