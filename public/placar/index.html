<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Placar — XXII Gincana Cultural</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Georgia&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tema.css">
  <style>
    body { margin: 0; overflow: hidden; background: transparent; font-family: Montserrat, Arial, sans-serif; }
    .bar {
      position: absolute; left: 50%; bottom: 3.2vh; transform: translateX(-50%);
      width: min(1100px, 90vw); display: none; grid-template-columns: 1fr auto 1fr;
      align-items: center; gap: 18px; padding: 14px 22px;
      background: linear-gradient(180deg, #fffdf8, #f2e6ce); border: 3px solid var(--azul);
      box-shadow: var(--sombra); border-radius: 8px;
    }
    .bar.show { display: grid; }
    .team {
      display: flex; align-items: center; gap: 14px;
    }
    .team.b { flex-direction: row-reverse; text-align: right; }
    .name { font-weight: 900; font-size: clamp(16px, 1.6vw, 28px); text-transform: uppercase; color: var(--azul); }
    .pts { font-family: Georgia, serif; font-size: clamp(28px, 3vw, 48px); font-weight: bold; color: var(--verde); }
    .mid {
      text-align: center; font-size: 12px; font-weight: 900; letter-spacing: .16em; color: var(--terracota);
    }
    .full {
      position: absolute; inset: 0; display: none; place-items: center;
      background: radial-gradient(circle at 50% 30%, #fffdf8, #f2e6ce 78%);
    }
    .full.show { display: grid; }
    .full-card {
      width: min(1200px, 88vw); background: var(--papel); border: 4px solid var(--azul);
      padding: 5vh 4vw; box-shadow: var(--sombra); text-align: center;
    }
    .full-card h1 { font-family: Georgia, serif; font-size: clamp(40px, 5vw, 78px); color: var(--azul); margin: 0 0 3vh; }
    .rows { display: grid; gap: 2vh; }
    .row {
      display: grid; grid-template-columns: 100px 1fr 180px; align-items: center;
      background: #fff; border: 2px solid #0b355528; border-left: 10px solid var(--azul); padding: 1.5vh 1.5vw;
    }
    .row .score { font-family: Georgia, serif; font-size: clamp(32px, 3.5vw, 56px); font-weight: bold; color: var(--verde); }
  </style>
</head>
<body class="obs-transparent">
  <div class="bar" id="bar">
    <div class="team a" id="teamA"></div>
    <div class="mid">PLACAR GERAL</div>
    <div class="team b" id="teamB"></div>
  </div>
  <div class="full" id="full">
    <div class="full-card">
      <h1>Placar Geral</h1>
      <div class="rows" id="fullRows"></div>
    </div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/client.js"></script>
  <script>
    const bar = document.getElementById('bar');
    const full = document.getElementById('full');
    const client = Gincana.connect();
    client.onState((state) => {
      const eqs = state.equipes || [];
      const a = eqs[0], b = eqs[1];
      const show = state.placar && state.placar.visible;
      const compact = !state.placar || state.placar.compact !== false;
      bar.classList.toggle('show', show && compact);
      full.classList.toggle('show', show && !compact);
      if (a) {
        teamA.innerHTML = `${Gincana.brasaoHtml(a, 56)}<div><div class="name">${a.nome}</div><div class="pts">${Gincana.fmtPts(a.pontuacao_total)}</div></div>`;
      }
      if (b) {
        teamB.innerHTML = `${Gincana.brasaoHtml(b, 56)}<div><div class="name">${b.nome}</div><div class="pts">${Gincana.fmtPts(b.pontuacao_total)}</div></div>`;
      }
      fullRows.innerHTML = eqs.map((e, i) => `
        <div class="row" style="border-left-color:${e.cor || 'var(--azul)'}">
          <div>${Gincana.brasaoHtml(e, 64)}</div>
          <div class="name" style="font-size:clamp(22px,2.4vw,40px);font-weight:900">${e.nome}</div>
          <div class="score">${Gincana.fmtPts(e.pontuacao_total)} <small style="font-size:.35em;letter-spacing:.1em">PTS</small></div>
        </div>`).join('');
    });
  </script>
</body>
</html>
