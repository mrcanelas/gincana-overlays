<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apuração Geral — Nota a Nota</title>
<style>
:root{--azul:#07375a;--azul2:#061d3c;--verde:#17663f;--ouro:#dda20e;--terra:#b7462e;--creme:#f6efdf;--papel:#fffdf7}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Montserrat,Arial,sans-serif;background:transparent;color:var(--azul2)}
.stage{width:100vw;height:100vh;position:relative;background:radial-gradient(circle at 50% 25%,#fffdf8,#f2e6ce 78%);display:flex;flex-direction:column;align-items:center;padding:4.7vh 4vw}.topbar{width:92vw;display:flex;align-items:center;justify-content:center;gap:2vw}.line{height:4px;flex:1;background:linear-gradient(90deg,transparent,var(--ouro),var(--verde))}.line.r{transform:scaleX(-1)}
.event{text-align:center;font-size:clamp(14px,1.15vw,23px);letter-spacing:.18em;font-weight:900;color:var(--verde)}h1{font-family:Georgia,serif;font-size:clamp(42px,4.7vw,90px);line-height:1;margin:1.2vh 0 .4vh;text-transform:uppercase;color:var(--azul)}.under{font-size:clamp(15px,1.2vw,24px);text-transform:uppercase;font-weight:800;letter-spacing:.12em;color:var(--terra)}
.teamcard{margin-top:3vh;width:min(1540px,88vw);background:var(--papel);box-shadow:0 22px 65px #00193238;border:3px solid var(--azul);position:relative;padding:3.2vh 3vw 3.6vh}.teamcard:before,.teamcard:after{content:"";position:absolute;top:-3px;bottom:-3px;width:14px;background:repeating-linear-gradient(0deg,var(--verde) 0 24px,var(--ouro) 24px 48px,var(--terra) 48px 72px,var(--azul) 72px 96px)}.teamcard:before{left:-17px}.teamcard:after{right:-17px}
.teamname{text-align:center;font-size:clamp(30px,3vw,58px);font-weight:950;color:var(--azul);text-transform:uppercase;letter-spacing:.03em}.label{text-align:center;color:var(--verde);font-weight:850;letter-spacing:.15em;font-size:clamp(12px,.95vw,18px);margin-top:.5vh}.notes{display:grid;grid-template-columns:repeat(5,1fr);gap:1.4vw;margin:3vh 0 2.5vh}.note{height:21vh;min-height:160px;border:2px solid #0a35543c;background:#f8f0df;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}.note:before{content:"";position:absolute;inset:0;background:linear-gradient(130deg,transparent 20%,#fff 48%,transparent 72%);transform:translateX(-120%)}.note.reveal:before{animation:shine .8s}.juror{position:absolute;top:14px;font-size:clamp(12px,.95vw,18px);font-weight:900;letter-spacing:.09em;color:var(--verde);text-transform:uppercase}.value{font-family:Georgia,serif;font-size:clamp(50px,5.5vw,105px);font-weight:bold;color:var(--azul);opacity:0;transform:scale(1.8) rotate(-5deg);filter:blur(10px)}.note.reveal .value{animation:reveal .8s cubic-bezier(.15,.9,.18,1) forwards}.note.reveal{border-color:var(--ouro);box-shadow:0 0 0 4px #dda20e38}.note.current{animation:pulse 1s infinite alternate}.note small{position:absolute;bottom:13px;font-weight:800;color:#173b5680;letter-spacing:.1em}
.bottom{display:grid;grid-template-columns:1fr 330px;gap:2vw;align-items:stretch}.status{background:var(--azul2);color:var(--creme);display:flex;align-items:center;padding:0 2.5vw;font-size:clamp(18px,1.7vw,33px);font-weight:850;letter-spacing:.04em}.total{background:var(--ouro);color:var(--azul2);text-align:center;padding:1.1vh 1vw}.total b{display:block;font-family:Georgia,serif;font-size:clamp(40px,4vw,75px);line-height:1}.total span{font-weight:900;font-size:13px;letter-spacing:.14em}.winner{position:absolute;inset:0;display:grid;place-items:center;background:#061d3ceF;opacity:0;pointer-events:none;transition:.7s;z-index:5}.winner.show{opacity:1}.winnerbox{text-align:center;color:var(--creme);transform:scale(.75);transition:.8s cubic-bezier(.15,.9,.18,1)}.winner.show .winnerbox{transform:scale(1)}.winner .small{font-weight:900;letter-spacing:.3em;color:var(--ouro);font-size:clamp(18px,1.5vw,30px)}.winner .big{font-family:Georgia,serif;font-size:clamp(65px,8vw,150px);font-weight:bold;text-transform:uppercase}.winner .pts{font-size:clamp(24px,2.5vw,48px);font-weight:900;color:var(--ouro)}.motif{font-size:55px;color:var(--ouro);margin:2vh}.footer{position:absolute;bottom:2.2vh;font-weight:800;color:#07375a8e;letter-spacing:.08em;font-size:14px}
@keyframes reveal{to{opacity:1;transform:none;filter:none}}@keyframes shine{to{transform:translateX(120%)}}@keyframes pulse{to{box-shadow:0 0 0 8px #dda20e44}}@keyframes pop{50%{transform:scale(1.08)}}
</style></head><body><main class="stage"><div class="topbar"><i class="line"></i><div class="event">XXII GINCANA CULTURAL • CETI JNA</div><i class="line r"></i></div><h1>Apuração Geral</h1><div class="under">Nota por nota • resultado oficial</div>
<section class="teamcard"><div class="teamname" id="teamname"></div><div class="label" id="roundLabel"></div><div class="notes" id="notes"></div><div class="bottom"><div class="status" id="status">Aguardando a primeira nota…</div><div class="total"><b id="total">—</b><span>TOTAL DA EQUIPE</span></div></div></section><div class="footer">ESPAÇO: revelar nota • →: próxima equipe • ←: anterior • R: reiniciar • W: resultado final</div>
<section class="winner" id="winner"><div class="winnerbox"><div class="small">CAMPEÃ GERAL • 2026</div><div class="motif">✦ ❖ ✦</div><div class="big" id="winnerName"></div><div class="pts" id="winnerPts"></div></div></section></main>
<script>
// EDITE AQUI. Use ponto para casas decimais. Adicione ou remova equipes conforme necessário.
const EQUIPES=[
 {nome:'EQUIPE AZUL',notas:[9.8,10,9.7,9.9,10]},
 {nome:'EQUIPE VERDE',notas:[10,9.9,10,9.8,9.9]},
 {nome:'EQUIPE TERRACOTA',notas:[9.7,9.8,9.9,10,9.8]}
];
const JURADOS=['JURADO 1','JURADO 2','JURADO 3','JURADO 4','JURADO 5'];let equipe=0,revelada=0;
const fmt=n=>Number.isInteger(n)?n.toFixed(1):n.toFixed(1);const soma=e=>e.notas.reduce((a,b)=>a+b,0);
function montar(){const e=EQUIPES[equipe];teamname.textContent=e.nome;roundLabel.textContent=`EQUIPE ${equipe+1} DE ${EQUIPES.length}`;notes.innerHTML=e.notas.map((n,i)=>`<div class="note"><div class="juror">${JURADOS[i]||'JURADO '+(i+1)}</div><div class="value">${fmt(n)}</div><small>NOTA</small></div>`).join('');revelada=0;total.textContent='—';status.textContent='Aguardando a primeira nota…';winner.classList.remove('show');marcar()}
function marcar(){document.querySelectorAll('.note').forEach((x,i)=>x.classList.toggle('current',i===revelada))}
function revelar(){const cards=[...document.querySelectorAll('.note')],e=EQUIPES[equipe];if(revelada<cards.length){cards[revelada].classList.remove('current');cards[revelada].classList.add('reveal');revelada++;status.textContent=revelada<cards.length?`Nota do ${JURADOS[revelada-1]} revelada — aguardando ${JURADOS[revelada]}`:'Todas as notas reveladas';marcar();if(revelada===cards.length){setTimeout(()=>{total.textContent=fmt(soma(e));status.textContent='TOTAL CONFIRMADO';document.querySelector('.total').style.animation='pop .65s'},600)}}}
function mudar(d){equipe=(equipe+d+EQUIPES.length)%EQUIPES.length;montar()}
function final(){const ord=[...EQUIPES].sort((a,b)=>soma(b)-soma(a));winnerName.textContent=ord[0].nome;winnerPts.textContent=`${fmt(soma(ord[0]))} PONTOS`;winner.classList.toggle('show')}
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();revelar()}if(e.code==='ArrowRight')mudar(1);if(e.code==='ArrowLeft')mudar(-1);if(e.key==='r'||e.key==='R')montar();if(e.key==='w'||e.key==='W')final()});montar();
</script></body></html>
