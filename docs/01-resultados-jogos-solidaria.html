<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resultados — Jogos e Prova Solidária</title>
<style>
:root{--azul:#07375a;--azul2:#061f3f;--verde:#17663f;--mostarda:#d99a08;--terracota:#b9472e;--creme:#f5edda;--branco:#fffdf7;--sombra:0 18px 50px #00152d55}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Montserrat,Arial,sans-serif;background:transparent;color:var(--azul2)}
body{display:grid;place-items:center}.stage{width:100vw;height:100vh;position:relative;display:grid;place-items:center;padding:5vh 5vw;background:linear-gradient(125deg,#f8f1e1 0 68%,#efe1c4 100%)}
.frame{position:absolute;inset:2.4vh 1.35vw;border:5px solid var(--azul);pointer-events:none}.frame:after{content:"";position:absolute;inset:8px;border:2px solid var(--mostarda)}
.corner{position:absolute;width:150px;height:150px;background:conic-gradient(from 45deg,var(--azul) 0 25%,var(--creme) 0 32%,var(--verde) 0 50%,var(--creme) 0 57%,var(--terracota) 0 75%,var(--creme) 0 82%,var(--mostarda) 0);clip-path:polygon(0 0,100% 0,0 100%);z-index:2}.c1{top:2.4vh;left:1.35vw}.c2{top:2.4vh;right:1.35vw;transform:rotate(90deg)}.c3{bottom:2.4vh;right:1.35vw;transform:rotate(180deg)}.c4{bottom:2.4vh;left:1.35vw;transform:rotate(270deg)}
.panel{width:min(1420px,84vw);min-height:76vh;display:flex;flex-direction:column;align-items:center;position:relative;z-index:3}
.eyebrow{font-size:clamp(15px,1.3vw,25px);letter-spacing:.22em;font-weight:800;color:var(--verde);margin-top:1vh}.title{font-family:Georgia,serif;font-size:clamp(48px,5.6vw,106px);line-height:.94;text-align:center;margin:1.4vh 0 .5vh;color:var(--azul);text-transform:uppercase}.subtitle{font-size:clamp(16px,1.35vw,27px);font-weight:800;letter-spacing:.08em;color:var(--terracota);text-transform:uppercase}.orn{display:flex;align-items:center;gap:16px;width:min(600px,60vw);margin:2vh 0}.orn:before,.orn:after{content:"";height:3px;flex:1;background:linear-gradient(90deg,transparent,var(--mostarda),var(--verde))}.orn:after{transform:scaleX(-1)}.flower{width:22px;height:22px;background:var(--terracota);transform:rotate(45deg);border:5px solid var(--creme);outline:3px solid var(--azul)}
.ranking{width:min(1100px,74vw);display:grid;gap:1.5vh;margin-top:1vh}.row{display:grid;grid-template-columns:120px 1fr 220px;align-items:center;min-height:11vh;background:#fffdf7;border:2px solid #0b355528;border-left:11px solid var(--azul);box-shadow:var(--sombra);opacity:0;transform:translateY(35px) scale(.97);transition:.65s cubic-bezier(.2,.9,.25,1)}.row.show{opacity:1;transform:none}.row:nth-child(1){border-left-color:var(--mostarda)}.row:nth-child(2){border-left-color:#8f9aa3}.row:nth-child(3){border-left-color:#a76132}
.place{font-family:Georgia,serif;font-size:clamp(30px,3.4vw,65px);font-weight:bold;text-align:center}.team{font-size:clamp(23px,2.25vw,43px);font-weight:900;text-transform:uppercase}.score{text-align:center;border-left:2px solid #0b355528;font-size:clamp(20px,2vw,38px);font-weight:900;color:var(--verde)}.score small{display:block;font-size:.38em;letter-spacing:.16em;color:var(--azul);margin-top:4px}
.hint{position:absolute;right:3vw;bottom:2.7vh;color:#07375a88;font-weight:700;font-size:14px}.brand{position:absolute;left:3vw;bottom:2.7vh;font-size:14px;font-weight:800;color:var(--azul);letter-spacing:.08em}.seal{position:absolute;right:4.1vw;top:5vh;width:96px;height:96px;border-radius:50%;background:var(--azul);color:var(--creme);display:grid;place-items:center;text-align:center;font-weight:900;font-size:13px;border:6px solid var(--mostarda);transform:rotate(5deg)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.flash.go{animation:flash .55s}@keyframes flash{50%{opacity:.25}}
</style></head>
<body><main class="stage"><div class="frame"></div><i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i><div class="flash"></div>
<section class="panel"><div class="eyebrow">XXII GINCANA CULTURAL • CETI JNA</div><h1 class="title" id="titulo">Jogos Esportivos</h1><div class="subtitle" id="subtitulo">Resultado oficial</div><div class="orn"><i class="flower"></i></div><div class="ranking" id="ranking"></div></section>
<div class="seal" id="selo">BRASIL<br>DE MUITOS<br>BRASIS</div><div class="brand">SOMOS RITMOS, SABORES, CORES E SABERES</div><div class="hint">ESPAÇO: revelar • 1/2/3: categoria • R: reiniciar</div></main>
<script>
// EDITE AQUI os títulos, nomes, colocações e pontuações.
const CATEGORIAS=[
 {titulo:'Jogos Esportivos',subtitulo:'Resultado oficial',resultados:[['1º','EQUIPE AZUL','100 PONTOS'],['2º','EQUIPE VERDE','80 PONTOS'],['3º','EQUIPE TERRACOTA','60 PONTOS']]},
 {titulo:'Jogos Online',subtitulo:'Resultado oficial',resultados:[['1º','EQUIPE VERDE','100 PONTOS'],['2º','EQUIPE AZUL','80 PONTOS'],['3º','EQUIPE TERRACOTA','60 PONTOS']]},
 {titulo:'Prova Solidária',subtitulo:'Resultado oficial',resultados:[['1º','EQUIPE TERRACOTA','150 PONTOS'],['2º','EQUIPE VERDE','120 PONTOS'],['3º','EQUIPE AZUL','100 PONTOS']]}
];
let atual=Math.max(0,Math.min(2,(+(new URLSearchParams(location.search).get('categoria')||1))-1)),revelados=0;
const ranking=document.querySelector('#ranking');
function montar(){const c=CATEGORIAS[atual];titulo.textContent=c.titulo;subtitulo.textContent=c.subtitulo;ranking.innerHTML=c.resultados.map(r=>`<div class="row"><div class="place">${r[0]}</div><div class="team">${r[1]}</div><div class="score">${r[2]}<small>RESULTADO</small></div></div>`).join('');revelados=0}
function revelar(){const rows=[...document.querySelectorAll('.row')];if(revelados<rows.length){rows[revelados++].classList.add('show');document.querySelector('.flash').classList.remove('go');void document.body.offsetWidth;document.querySelector('.flash').classList.add('go')}}
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowRight'){e.preventDefault();revelar()}if(e.key==='r'||e.key==='R')montar();if(['1','2','3'].includes(e.key)){atual=+e.key-1;montar()}});montar();
</script></body></html>
